name: ARC Raiders 新闻监控

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: seen-cache
        with:
          path: seen_state.json
          key: arc-news-seen-v1
      - name: 运行监控脚本
        env:
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
        run: python monitor.py

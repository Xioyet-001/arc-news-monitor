name: ARC‑Raiders新闻监控

on:
  workflow_dispatch:
  schedule:
    # 错开高峰：每30分钟12分、42分执行
    - cron: "12,42 * * * *"

jobs:
  monitor:
    runs-on: ubuntu‑latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v6

      - name: 加载已推送记录缓存
        uses: actions/cache@v5
        with:
          path: pushed.json
          key: arc‑news‑pushed‑cache

      - name: 设置Python3.12
        uses: actions/setup-python@v5
        with:
          python‑version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 运行新闻监控脚本
        run: python3 monitor.py

      - name: 更新缓存
        uses: actions/cache@v5
        with:
          path: pushed.json
          key: arc‑news‑pushed‑cache

name: ARC Raiders 新闻监控

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取已推送记录缓存
        uses: actions/cache@v4
        id: cache_read
        with:
          path: seen_state.json
          key: arc-news-seen-v1

      - name: 安装Python依赖
        run: pip install requests urllib3

      - name: 运行监控python脚本
        env:
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
        run: python monitor.py

      - name: 写入保存已推送记录缓存
        uses: actions/cache@v4
        with:
          path: seen_state.json
          key: arc-news-seen-v1
